name: OpenCode on demand

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Instruction for OpenCode
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  comment:
    if: github.event_name != 'workflow_dispatch' && !contains(github.event.comment.body, '/nvidia') && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode — Go quality lane
        id: go
        timeout-minutes: 35
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3

      - name: Run OpenCode — free fallback
        timeout-minutes: 15
        if: steps.go.outcome == 'failure'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ vars.OPENCODE_PRIMARY_MODEL || 'opencode/nemotron-3-ultra-free' }}

  nvidia_comment:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/nvidia') && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) && github.actor == 'CGProductionHouse'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode — NVIDIA direct lane
        timeout-minutes: 45
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Explicit aliases let the supervisor route work by model without changing secrets.
          # /nvidia or /nvidia-kimi        -> Kimi K3, long-horizon + multimodal
          # /nvidia-deepseek              -> DeepSeek V4 Pro, coding/reasoning
          # /nvidia-poolside              -> Laguna XS 2.1, agentic coding/terminal
          # /nvidia-lightning             -> Nemotron 3.5 Lightning, fast sub-agent
          # /nvidia-ultra                 -> Nemotron 3 Ultra, hardest reasoning/long context
          # /nvidia-step                  -> Step 3.7 Flash, visual + coding agent work
          model: ${{ contains(github.event.comment.body, '/nvidia-deepseek') && 'nvidia/deepseek-ai/deepseek-v4-pro-0813' || contains(github.event.comment.body, '/nvidia-poolside') && 'nvidia/poolside/laguna-xs-2.1' || contains(github.event.comment.body, '/nvidia-lightning') && 'nvidia/nvidia/nemotron-3.5-lightning-30b-a3b' || contains(github.event.comment.body, '/nvidia-ultra') && 'nvidia/nvidia/nemotron-3-ultra-550b-a55b' || contains(github.event.comment.body, '/nvidia-step') && 'nvidia/stepfun-ai/step-3.7-flash' || vars.OPENCODE_NVIDIA_MODEL || 'nvidia/moonshotai/kimi-k3' }}

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode — Go quality lane
        id: go
        timeout-minutes: 35
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3
          prompt: ${{ inputs.prompt }}

      - name: Run OpenCode — free fallback
        timeout-minutes: 15
        if: steps.go.outcome == 'failure'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ vars.OPENCODE_PRIMARY_MODEL || 'opencode/nemotron-3-ultra-free' }}
          prompt: ${{ inputs.prompt }}
