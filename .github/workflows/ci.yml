name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/ownerDevBridge.test.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_placeholder
      - name: Install owner dev bridge
        run: npm ci
        working-directory: dev-bridge
      - name: Test owner dev bridge
        run: npm test
        working-directory: dev-bridge
      - name: Build owner dev bridge
        run: npm run build
        working-directory: dev-bridge
