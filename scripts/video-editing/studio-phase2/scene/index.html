<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="./assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: Space Grotesk; src: url("./assets/SpaceGrotesk.ttf"); font-weight: 300 700; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #10151a; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #f2f1e8; font-family: Space Grotesk, sans-serif; }
    .clip { position: absolute; inset: 0; overflow: hidden; }
    #background { background: radial-gradient(circle at 56% 43%, #263743 0%, #10151a 67%); }
    #background::before { content: ""; position: absolute; inset: 0; opacity: .12; background: repeating-linear-gradient(0deg, transparent 0 67px, #bdcad1 68px 69px), repeating-linear-gradient(90deg, transparent 0 67px, #bdcad1 68px 69px); }
    .frame { position: absolute; inset: 138px 72px 166px; border: 2px solid rgba(242,241,232,.35); border-radius: 460px 460px 18px 18px; }
    .halo { position: absolute; top: 345px; left: 115px; width: 850px; height: 850px; border: 4px solid #c8ff55; border-radius: 50%; opacity: .88; }
    .halo.two { inset: 455px auto auto 225px; width: 630px; height: 630px; border-color: rgba(242,241,232,.35); }
    .topline { position: absolute; top: 82px; left: 74px; right: 74px; display: flex; justify-content: space-between; font-size: 26px; font-weight: 600; letter-spacing: .13em; }
    .topline span:last-child { color: #c8ff55; }
    .small { position: absolute; top: 327px; left: 82px; color: #c8ff55; font-size: 28px; font-weight: 700; letter-spacing: .19em; }
    .word { position: absolute; left: 72px; line-height: .84; font-weight: 700; letter-spacing: -.09em; white-space: nowrap; transform-origin: 50% 50%; text-shadow: 0 4px 35px rgba(5,13,18,.26); }
    #word-one { top: 625px; font-size: 260px; }
    #word-two { top: 888px; font-size: 255px; color: #c8ff55; }
    #word-three { top: 1150px; font-size: 204px; }
    .rule { position: absolute; bottom: 427px; left: 76px; width: 930px; height: 3px; background: rgba(242,241,232,.85); transform-origin: left center; }
    .strap { position: absolute; bottom: 322px; left: 76px; width: 700px; font-size: 35px; font-weight: 500; letter-spacing: .045em; line-height: 1.25; }
    .index { position: absolute; right: 80px; bottom: 318px; font-size: 84px; font-weight: 700; letter-spacing: -.08em; color: #c8ff55; }
    .corner { position: absolute; bottom: 75px; left: 76px; font-size: 25px; font-weight: 600; letter-spacing: .18em; color: #a8bac0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
    <section id="background" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
      <div class="frame"></div><div class="halo"></div><div class="halo two"></div>
    </section>
    <section id="type" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
      <div class="topline"><span>ECHOFORM / AUDIO STUDY</span><span>001 — 024</span></div>
      <div class="small">LISTEN BEYOND THE FRAME</div>
      <div class="word" id="word-one">FEEL</div>
      <div class="word" id="word-two">THE</div>
      <div class="rule"></div>
      <div class="strap">FIND YOUR FREQUENCY.</div>
      <div class="index">01</div>
      <div class="corner">ECHOFORM / CONCEPT FILM</div>
    </section>
    <section id="late-type" class="clip" data-start="1.38" data-duration="3.12" data-track-index="2">
      <div class="word" id="word-three">BASS.</div>
    </section>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('.frame', { opacity: 0, scale: .82 }, { opacity: 1, scale: 1, duration: 1.1, ease: 'power3.out' }, 0);
    tl.fromTo('.halo', { opacity: 0, scale: .55, rotation: -22 }, { opacity: .88, scale: 1, rotation: 0, duration: 1.5, ease: 'power3.out' }, .12);
    tl.fromTo('.halo.two', { opacity: 0, scale: .76 }, { opacity: .5, scale: 1, duration: 1.55, ease: 'power2.out' }, .35);
    tl.fromTo('.topline', { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: .5, ease: 'power2.out' }, .12);
    tl.fromTo('.small', { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: .45, ease: 'power2.out' }, .4);
    tl.fromTo('#word-one', { opacity: 0, x: -270, skewX: -9 }, { opacity: 1, x: 0, skewX: 0, duration: .72, ease: 'power4.out' }, .46);
    tl.fromTo('#word-two', { opacity: 0, x: 270, skewX: 9 }, { opacity: 1, x: 0, skewX: 0, duration: .72, ease: 'power4.out' }, .92);
    tl.fromTo('#word-three', { opacity: 0, y: 210, scale: .83 }, { opacity: 1, y: 0, scale: 1, duration: .8, ease: 'expo.out' }, 1.38);
    tl.fromTo('.rule', { scaleX: 0 }, { scaleX: 1, duration: .9, ease: 'power3.out' }, 1.54);
    tl.fromTo('.strap, .index, .corner', { opacity: 0, y: 35 }, { opacity: 1, y: 0, stagger: .09, duration: .55, ease: 'power2.out' }, 1.72);
    tl.fromTo('#word-three', { x: 0, rotationY: 0 }, { x: -52, rotationY: -8, duration: 1.35, ease: 'sine.inOut', transformPerspective: 900 }, 2.48);
    tl.fromTo('.halo', { rotation: 0 }, { rotation: 34, duration: 2, ease: 'sine.inOut', immediateRender: false }, 2.2);
    window.__timelines.main = tl;
  </script>
</body>
</html>
