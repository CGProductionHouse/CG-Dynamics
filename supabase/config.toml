[functions.ensure-client-from-cg-hours]
# Server-to-server authentication is enforced inside the function with the
# dedicated CG_HOURS_BRIDGE_SECRET. The caller never receives a Dynamics JWT.
verify_jwt = false

[functions.instagram-deauthorize]
# Meta HMAC-SHA256 signed_request verified by the handler, not a Supabase JWT.
verify_jwt = false

[functions.instagram-data-deletion]
# POST: Meta signed_request. GET: opaque bearer confirmation, safe status only.
verify_jwt = false

[functions.website-enquiry-delivery-worker]
# Scheduler authenticates with x-worker-secret (WEBSITE_ENQUIRY_WORKER_SECRET), checked in
# constant time by the handler. No Supabase JWT or service-role bearer is issued to it.
verify_jwt = false

[functions.website-enquiry-delivery-webhook]
# Provider (Resend/Svix) HMAC signature verified by the handler, not a Supabase JWT.
verify_jwt = false

[functions.website-enquiry-intake]
# Only a trusted Website server with a private exact endpoint capability reaches
# the canonical service-only RPC. Handler authenticates/binds; no browser JWT.
verify_jwt = false
